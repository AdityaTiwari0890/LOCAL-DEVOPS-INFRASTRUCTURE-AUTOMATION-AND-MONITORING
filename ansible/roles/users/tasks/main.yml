---
- name: Ensure application service user exists
  ansible.builtin.user:
    name: devops
    shell: /bin/bash
    create_home: true
    system: false
    state: present

- name: Create project root
  ansible.builtin.file:
    path: /opt/local-devops
    state: directory
    owner: devops
    group: devops
    mode: "0755"

- name: Create environment metadata directories
  ansible.builtin.file:
    path: "/opt/local-devops/{{ item }}"
    state: directory
    owner: devops
    group: devops
    mode: "0755"
  loop:
    - environments
    - logs
